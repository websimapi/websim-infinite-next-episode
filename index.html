<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinite Next Episode</title>
  <!-- Add importmap for WebsimSocket -->
  <script type="importmap">
  {
    "imports": {
      "@websim/websim-socket": "https://esm.websim.com/@websim/websim-socket"
    }
  }
  </script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #searchContainer {
      position: absolute;
      top: 20px; left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 90%;
      max-width: 1200px;
    }
    #searchBarWrapper {
      display: flex;
      gap: 8px;
    }
    #seriesSearch {
      flex-grow: 1;
    }
    #searchContainer input, 
    #searchContainer button {
      padding: 10px; font-size: 1em;
    }
    #searchButtons {
      display: flex;
      gap: 8px;
    }
    #seriesList {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px,1fr));
      gap: 12px;
    }
    .seriesCard {
      background: var(--surface-color);
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-align: center;
      position: relative;
      padding-bottom: 35px; /* Space for author info */
    }
    .seriesCard:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }
    .seriesCard img {
      width: 100%;
      height: 80px;
      object-fit: contain;
      margin-bottom: 6px;
    }
    .seriesCard h3 {
      margin: 4px 0;
      font-size: 1em;
      color: var(--primary-color);
    }
    .seriesCard p {
      font-size: 0.85em;
      color: var(--text-color);
      margin: 0;
    }
    .author-info {
      position: absolute;
      bottom: 8px;
      right: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75em;
      background-color: rgba(0,0,0,0.5);
      padding: 3px 6px;
      border-radius: 12px;
    }
    .author-info img {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0;
    }
    #player {
      display: none;
      position: relative;
      width: 100%;
      height: 100vh;
      background-size: cover;
      background-position: center;
    }
    #seriesLogo {
      position: absolute;
      top: 20px; left: 20px;
      height: 100px;
      width: auto;
      object-fit: contain;
      background: var(--surface-color);
      border: 2px solid var(--primary-color);
      border-radius: 8px;
      padding: 4px;
    }
    #seriesTitle {
      position: absolute;
      top: 140px;   /* pushed down to accommodate larger logo */
      left: 20px;
      font-size: 2em; color: white;
      text-shadow: 0 0 5px rgba(0,0,0,0.7);
    }
    #episodeInfo {
      position: absolute;
      top: 180px;
      left: 20px;
      font-size: 1.2em; color: white;
      text-shadow: 0 0 5px rgba(0,0,0,0.7);
    }
    #episodeTitle {
      position: absolute;
      top: 180px;  /* align with episodeInfo */
      left: 120px; /* shift right of episodeInfo */
      font-size: 1.5em; color: white;
      text-shadow: 0 0 5px rgba(0,0,0,0.7);
    }
    #controls {
      position: absolute;
      bottom: 20px; right: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }
    #upNextContainer {
      width: 120px; height: 68px;
      border: 2px solid white;
      overflow: hidden;
    }
    #upNextContainer img {
      width: 100%; height: 100%; object-fit: cover;
    }
    button {
      position: relative;
      padding: 10px 20px;
      font-size: 1em;
      color: white;
      background: transparent;
      border: 2px solid white;
      cursor: pointer;
      overflow: hidden;
    }
    #nextButton .progress {
      position: absolute;
      top: 0; left: 0;
      height: 100%; width: 0;
      background: linear-gradient(to right, #4caf50, #81c784);
      z-index: 1;
      transition: width 15s linear;
    }
    #nextButton span,
    #moreButton span {
      position: relative;
      z-index: 2;
    }
    #moreEpisodesModal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    #moreEpisodesModal .modalContent {
      background: var(--surface-color);
      padding: 20px;
      max-height: 80%;
      overflow-y: auto;
      width: 80%;
      max-width: 1000px; /* Added max-width */
      border-radius: 8px;
      position: relative;
      display: flex; /* For layout */
    }
    #moreEpisodesModal .modalContent img {
      width: 100%;
      max-width: 200px;
      display: block;
      margin-bottom: 10px;
    }
    #closeModal {
      position: absolute;
      top: 10px; right: 10px;
      background: transparent;
      border: none;
      font-size: 1.5em;
      cursor: pointer;
      color: var(--text-color); /* ensure visibility */
      z-index: 10; /* Make sure it's on top */
    }

    .modalLayout {
      display: flex;
      width: 100%;
      height: 100%;
      gap: 20px;
    }

    #seasonTabs {
      flex: 0 0 150px;
      border-right: 1px solid var(--border-color);
      padding-right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    #seasonTabs button {
      width: 100%;
      text-align: left;
      padding: 8px 12px;
      font-size: 1em;
    }

    #seasonTabs button.active {
      background-color: var(--primary-color);
      color: var(--surface-color);
      font-weight: bold;
    }

    #episodeListView {
      flex-grow: 1;
      overflow-y: auto;
      padding-right: 10px; /* space for scrollbar */
    }

    .episode-list-item {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .episode-list-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }
    .episode-list-item img {
      width: 160px;
      height: 90px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .episode-list-item .details {
      display: flex;
      flex-direction: column;
      min-width: 0; /* Prevents text overflow issues in flexbox */
    }
    .episode-list-item h3 {
      margin: 0 0 8px;
      font-size: 1.1em;
      color: var(--primary-color);
    }
    .episode-list-item p {
      margin: 0;
      font-size: 0.9em;
      color: var(--text-color);
      line-height: 1.4;
    }

    /* Dark mode variables */
    :root {
      --bg-color: #121212;
      --surface-color: #1e1e1e;
      --primary-color: #bb86fc;
      --secondary-color: #03dac6;
      --text-color: #e0e0e0;
      --border-color: #333;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
    }
    /* Search bar styling */
    #searchContainer input,
    #searchContainer button {
      background: var(--surface-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
    }
    /* Buttons */
    button {
      background: var(--surface-color);
      border-color: var(--primary-color);
      color: var(--primary-color);
    }
    #nextButton .progress {
      background: linear-gradient(to right, var(--secondary-color), var(--primary-color));
    }
    /* Modal */
    #moreEpisodesModal {
      background: rgba(0,0,0,0.9);
    }
    #moreEpisodesModal .modalContent {
      background: var(--surface-color);
      color: var(--text-color);
    }
    #closeModal {
      color: var(--text-color);
    }
    /* Grid layout for episode cards */
    #episodeList {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px,1fr));
      gap: 16px;
      padding: 20px 0;
    }
    #episodeList .episodeCard {
      background: var(--surface-color);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    #episodeList .episodeCard:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }
    #episodeList .episodeCard img {
      width: 100%;
      border-radius: 4px;
    }
    #episodeList .episodeCard h3 {
      margin: 10px 0 5px;
      font-size: 1em;
      color: var(--primary-color);
    }
    #episodeList .episodeCard p {
      font-size: 0.9em;
      color: var(--text-color);
      max-height: 3.6em;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <!-- Search Bar + Existing Series List -->
  <div id="searchContainer">
    <div id="searchBarWrapper">
      <input id="seriesSearch" type="text" placeholder="Filter series or enter prompt to generate..." />
      <button id="generateButton">Generate</button>
    </div>
    <h2 style="margin:12px 0 6px; color: var(--primary-color);">Existing Series</h2>
    <div id="seriesList"></div>
  </div>

  <!-- Main Player -->
  <div id="player">
    <img id="seriesLogo" src="" alt="Series Logo" />
    <div id="seriesTitle"></div>
    <div id="episodeInfo"></div>
    <div id="episodeTitle"></div>
    <div id="controls">
      <div id="upNextContainer">
        <img id="upNextImage" src="" alt="Up Next" />
      </div>
      <button id="nextButton">
        <div class="progress"></div>
        <span>Next Episode</span>
      </button>
      <button id="moreButton">
        <span>More Episodes</span>
      </button>
    </div>
  </div>

  <!-- More Episodes Modal -->
  <div id="moreEpisodesModal">
    <div class="modalContent">
      <button id="closeModal">&times;</button>
      <div class="modalLayout">
        <div id="seasonTabs"></div>
        <div id="episodeListView"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { WebsimSocket } from '@websim/websim-socket';

    // DOM refs
    const searchContainer = document.getElementById('searchContainer');
    const generateButton = document.getElementById('generateButton');
    const seriesSearch = document.getElementById('seriesSearch');
    const player = document.getElementById('player');
    const seriesTitleElem = document.getElementById('seriesTitle');
    const episodeTitleElem = document.getElementById('episodeTitle');
    const seriesLogoElem = document.getElementById('seriesLogo');
    const episodeInfo = document.getElementById('episodeInfo');
    const upNextImage = document.getElementById('upNextImage');
    const nextButton = document.getElementById('nextButton');
    const moreButton = document.getElementById('moreButton');
    const progressBar = nextButton.querySelector('.progress');
    const moreModal = document.getElementById('moreEpisodesModal');
    const closeModal = document.getElementById('closeModal');
    const seasonTabsContainer = document.getElementById('seasonTabs');
    const episodeListView = document.getElementById('episodeListView');
    const seriesList = document.getElementById('seriesList');

    // Initialize Websim DB and current user
    const room = new WebsimSocket();
    const currentUser = await window.websim.getCurrentUser();

    let seriesData = null;
    let allSeries = [];
    let currentIndex = 0;
    let autoTimer = null;
    let searchTimeout;

    // Subscribe and render existing series
    room.collection('series').subscribe(records => {
      allSeries = records;
      displaySeriesList(allSeries);
    });

    function displaySeriesList(records, filterText = '') {
      seriesList.innerHTML = '';
      const filteredRecords = filterText
        ? records.filter(rec => rec.title.toLowerCase().includes(filterText))
        : records;

      filteredRecords.forEach(rec => {
        const card = document.createElement('div');
        card.className = 'seriesCard';
        card.innerHTML = `
          <img src="${rec.logoUrl}" alt="${rec.title}" />
          <h3>${rec.title}</h3>
          <div class="author-info">
            <img src="https://images.websim.com/avatar/${rec.username}" alt="${rec.username}" />
            <span>${rec.username}${rec.forked_from ? ' (Forked)' : ''}</span>
          </div>
        `;
        card.addEventListener('click', () => loadExistingSeries(rec));
        seriesList.appendChild(card);
      });
    }

    async function loadExistingSeries(rec) {
      searchContainer.style.display = 'none';
      if (rec.username === currentUser.username) {
        const seasons = JSON.parse(rec.seasons);
        seriesData = {
          seriesTitle: rec.title,
          seriesLogoUrl: rec.logoUrl,
          seasons,
          currentSeason: 0,
          id: rec.id,
          forked_from: rec.forked_from
        };
      } else {
        const forked = await room.collection('series').upsert({
          title: rec.title,
          logoUrl: rec.logoUrl,
          seasons: rec.seasons,
          forked_from: rec.id
        });
        const seasons = JSON.parse(forked.seasons);
        seriesData = {
          seriesTitle: forked.title,
          seriesLogoUrl: forked.logoUrl,
          seasons,
          currentSeason: 0,
          id: forked.id,
          forked_from: forked.forked_from
        };
      }
      initPlayer();
    }

    seriesSearch.addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        const query = seriesSearch.value.trim().toLowerCase();
        displaySeriesList(allSeries, query);
      }, 500); // Auto-filter after 500ms of inactivity
    });

    generateButton.addEventListener('click', async () => {
      const query = seriesSearch.value.trim();
      if (!query) return;
      generateButton.disabled = true;
      generateButton.textContent = 'Loading...';
      const initialData = await generateSeries(query);
      seriesData = {
        seriesTitle: initialData.seriesTitle,
        seriesLogoUrl: initialData.seriesLogoUrl,
        seasons: [{ seasonPlot: initialData.seasonPlot, episodes: initialData.episodes }],
        currentSeason: 0
      };
      // Save to DB
      const rec = await room.collection('series').upsert({
        title: seriesData.seriesTitle,
        logoUrl: seriesData.seriesLogoUrl,
        seasons: JSON.stringify(seriesData.seasons),
        forked_from: null
      });
      seriesData.id = rec.id;
      initPlayer();
      generateButton.disabled = false;
      generateButton.textContent = 'Generate';
    });

    async function generateSeries(query) {
      // 1) AI: series metadata & plots
      const completion = await websim.chat.completions.create({
        messages: [
          {
            role: 'system',
            content: `
You are a helpful assistant. Generate a TV series with exactly one season of episodes based on the user's prompt.
Respond directly with JSON following this schema, and no extra text:
{
  seriesTitle: string;
  seasonPlot: string;
  episodes: [
    { title: string; plot: string; }
  ];
}`
          },
          { role: 'user', content: query }
        ],
        json: true
      });
      const data = JSON.parse(completion.content);

      // 2) AI: generate poster image for each episode via a dedicated prompt-generator
      for (let ep of data.episodes) {
        // 2a) Generate a tailored image prompt for this new episode
        const promptRes = await websim.chat.completions.create({
          messages: [
            {
              role: 'system',
              content: `
You are a helpful assistant. Given a TV series title, episode title, and episode plot, craft a vivid, detailed prompt for an AI image generator to produce a promotional poster scene with no text. Respond with pure JSON:
{
  "prompt": string
}`
            },
            {
              role: 'user',
              content: JSON.stringify({
                seriesTitle: data.seriesTitle,
                title: ep.title,
                plot: ep.plot
              }),
              json: true
            }
          ],
          json: true
        });
        const { prompt } = JSON.parse(promptRes.content);

        // 2b) Generate the episode image
        const img = await websim.imageGen({
          prompt,
          aspect_ratio: '16:9'
        });
        ep.imageUrl = img.url;
      }

      // 3) AI: generate a one-time series logo
      const logoRes = await websim.imageGen({
        prompt: `A stylized logo for the TV series titled "${data.seriesTitle}", on a solid background with a decorative frame.`,
        aspect_ratio: '1:1'
      });
      data.seriesLogoUrl = logoRes.url;

      return data;
    }

    // Generate the next season via AI
    async function generateNextSeason() {
      const seasonNum = seriesData.seasons.length + 1;
      const prev = seriesData.seasons[seriesData.currentSeason];
      const count = prev.episodes.length;
      const completion = await websim.chat.completions.create({
        messages: [
          {
            role: 'system',
            content: `You are a helpful assistant. Generate season ${seasonNum} for the series "${seriesData.seriesTitle}". Provide JSON following:
{ seasonPlot: string; episodes: [ { title: string; plot: string; } ] }
Respond with pure JSON. Generate exactly ${count} episodes.`
          }
        ],
        json: true
      });
      const data = JSON.parse(completion.content);

      for (let ep of data.episodes) {
        // a) Generate a tailored image prompt for this new episode
        const promptRes = await websim.chat.completions.create({
          messages: [
            {
              role: 'system',
              content: `
You are a helpful assistant. Given a TV series title, its season number, an episode title, and its plot, craft a vivid prompt for an AI image generator to produce a promotional poster scene with no text. Respond with pure JSON:
{
  "prompt": string
}`
            },
            {
              role: 'user',
              content: JSON.stringify({
                seriesTitle: seriesData.seriesTitle,
                season: seasonNum,
                title: ep.title,
                plot: ep.plot
              }),
              json: true
            }
          ],
          json: true
        });
        const { prompt } = JSON.parse(promptRes.content);

        // b) Generate the episode image
        const img = await websim.imageGen({
          prompt,
          aspect_ratio: '16:9'
        });
        ep.imageUrl = img.url;
      }

      seriesData.seasons.push({ seasonPlot: data.seasonPlot, episodes: data.episodes });
    }

    function initPlayer() {
      searchContainer.style.display = 'none';
      player.style.display = 'block';
      currentIndex = 0;
      updateUI();
      startAutoNext();
    }

    function updateUI() {
      // pick current season & episode
      const season = seriesData.seasons[seriesData.currentSeason];
      const episodes = season.episodes;
      const current = episodes[currentIndex];

      document.body.style.background = `url('${current.imageUrl}') center/cover no-repeat`;
      seriesLogoElem.src = seriesData.seriesLogoUrl;
      episodeInfo.textContent = `S:${seriesData.currentSeason+1} E:${currentIndex+1}`;
      seriesTitleElem.textContent = seriesData.seriesTitle;
      episodeTitleElem.textContent = current.title;

      const nextEp = episodes[currentIndex + 1];
      if (nextEp) {
        upNextImage.src = nextEp.imageUrl;
        nextButton.disabled = false;
        nextButton.querySelector('span').textContent = 'Next Episode';
      } else {
        upNextImage.src = './placeholder.png';
        // end of season
        nextButton.disabled = false;
        nextButton.querySelector('span').textContent = 'Next Season?';
      }
    }

    function startAutoNext() {
      progressBar.style.transition = 'none';
      progressBar.style.width = '0';
      requestAnimationFrame(() => {
        progressBar.style.transition = 'width 15s linear';
        progressBar.style.width = '100%';
      });
      autoTimer = setTimeout(() => {
        const season = seriesData.seasons[seriesData.currentSeason];
        if (currentIndex < season.episodes.length - 1) {
          nextEpisode();
        } else {
          loadNextSeason();
        }
      }, 15000);
    }

    function nextEpisode() {
      clearTimeout(autoTimer);
      const season = seriesData.seasons[seriesData.currentSeason];
      currentIndex++;
      if (currentIndex < season.episodes.length) {
        updateUI();
        startAutoNext();
      }
    }

    async function loadNextSeason() {
      clearTimeout(autoTimer);
      nextButton.disabled = true;
      progressBar.style.transition = 'none';
      progressBar.style.width = '0';
      nextButton.querySelector('span').textContent = 'Loading...';
      await generateNextSeason();
      // Persist updated seasons
      await room.collection('series').upsert({
        id: seriesData.id,
        seasons: JSON.stringify(seriesData.seasons)
      });
      seriesData.currentSeason++;
      currentIndex = 0;
      updateUI();
      startAutoNext();
    }

    nextButton.addEventListener('click', () => {
      clearTimeout(autoTimer);
      const season = seriesData.seasons[seriesData.currentSeason];
      if (currentIndex < season.episodes.length - 1) {
        nextEpisode();
      } else {
        loadNextSeason();
      }
    });

    moreButton.addEventListener('click', () => {
      populateModal(seriesData.currentSeason);
      moreModal.style.display = 'flex';
    });

    function populateModal(activeSeasonIndex) {
      // 1. Populate Season Tabs
      seasonTabsContainer.innerHTML = '';
      seriesData.seasons.forEach((season, index) => {
        const tab = document.createElement('button');
        tab.textContent = `Season ${index + 1}`;
        if (index === activeSeasonIndex) {
          tab.className = 'active';
        }
        tab.addEventListener('click', () => {
          // Re-populate with the new season as active
          populateModal(index);
        });
        seasonTabsContainer.appendChild(tab);
      });

      // 2. Populate Episode List View for the active season
      episodeListView.innerHTML = '';
      const season = seriesData.seasons[activeSeasonIndex];
      season.episodes.forEach((ep, idx) => {
        const item = document.createElement('div');
        item.className = 'episode-list-item';
        item.innerHTML = `
          <img src="${ep.imageUrl}" alt="${ep.title}" />
          <div class="details">
            <h3>S:${activeSeasonIndex + 1} E:${idx + 1} - ${ep.title}</h3>
            <p>${ep.plot}</p>
          </div>
        `;
        item.addEventListener('click', () => {
          // If switching seasons, update currentSeason
          if (seriesData.currentSeason !== activeSeasonIndex) {
            seriesData.currentSeason = activeSeasonIndex;
          }
          currentIndex = idx;
          moreModal.style.display = 'none';
          clearTimeout(autoTimer); // Stop timer when selecting from modal
          updateUI();
          startAutoNext();
        });
        episodeListView.appendChild(item);
      });
      // Scroll to top of list
      episodeListView.scrollTop = 0;
    }

    closeModal.addEventListener('click', () => {
      moreModal.style.display = 'none';
    });
  </script>
